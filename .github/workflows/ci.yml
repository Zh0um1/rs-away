name: CI

# 门禁内容对应 docs/plan.md §8.6 DoD 与 §10 G10。
# 本地与 CI 的分工见 docs/plan.md §4.13：本机 `/` 只读、装不了交叉 target，所以
# `build-matrix --local` 只跑宿主 musl 档，11 个 blocking 组合由这里的四个 build job 证明。
# 仓库公开运行（公开仓库的 Actions 不消耗私有仓库额度），因此 build matrix 全量跑。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 与 Cargo.toml 的 rust-version 对齐；本机 dev 环境因 / 只读只能用 stable（见 plan §4.2）。
  MSRV: "1.89.0"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 主门禁跑 stable：这是已被证明能过的形态。MSRV 单独一个 job 验证，
      # 免得「1.89 编不过」把 fmt/clippy/test 一起拖红，看不出失败原因。
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      # 传输层必须能在最小 feature 集下编译（plan.md §7 P2 出口判据）。
      - name: build (raw only)
        run: cargo build -p stowaway-transport --no-default-features --features transport-raw

  # Cargo.toml 声明 `rust-version = "1.89"`，但 `rust-toolchain.toml` 钉的是 stable，
  # 所以 `rustup default 1.89.0` 在仓库目录里会被工具链文件覆盖——必须用
  # RUSTUP_TOOLCHAIN 环境变量（rustup 优先级：env > toolchain file）。
  # 首次 CI 就因为漏了这点，MSRV 其实从未被验证过。
  msrv:
    name: rust 1.89 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: build (all targets, MSRV)
        run: cargo build --workspace --all-features
      - name: test (all targets, MSRV)
        run: cargo test --workspace --all-features

  doccheck:
    name: docs 源码引用校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Go baseline
        uses: actions/checkout@v7
        with:
          repository: ph4ntonn/Stowaway
          path: baseline/stowaway
          # 基线 HEAD 见 docs/plan.md 首页；升级基线必须同步改文档后再改这里。
          ref: 7f715be3e7331fa7fd558ba96bf3c3a3e6ddfbea
      - uses: Swatinem/rust-cache@v2
      - name: doccheck
        env:
          STOWAWAY_GO_BASELINE: ${{ github.workspace }}/baseline/stowaway
        run: cargo run -p xtask -- doccheck

  # §4.13 的 11 个 blocking 组合在这里证明「能否编译」。本地只验证宿主 musl 档
  # （`cargo xtask build-matrix --local`）：本机 `/` 只读，`rustup target add` 直接
  # 失败，装不上任何交叉 target（plan §1.3、§4.14 E22）。
  build-linux:
    name: build linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-unknown-linux-gnu
            apt: ""
            linker: ""
            xcc: ""
            xcc_dir: ""
            cc_env: ""
            cc: ""
            rflags_env: ""
            tier3: false
          - arch: i686
            triple: i686-unknown-linux-gnu
            apt: gcc-multilib
            linker: ""
            xcc: ""
            xcc_dir: ""
            cc_env: ""
            cc: ""
            rflags_env: ""
            tier3: false
          - arch: aarch64
            triple: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            xcc: ""
            xcc_dir: ""
            cc_env: ""
            cc: ""
            rflags_env: ""
            tier3: false
          - arch: arm (tier-3)
            triple: armv5te-unknown-linux-musleabi
            apt: ""
            linker: arm-buildroot-linux-musleabi-gcc
            xcc: https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--musl--stable-2024.02-1.tar.bz2
            xcc_dir: armv5-eabi--musl--stable-2024.02-1
            cc_env: CC_armv5te_unknown_linux_musleabi
            cc: arm-buildroot-linux-musleabi-gcc
            rflags_env: CARGO_TARGET_ARMV5TE_UNKNOWN_LINUX_MUSLEABI_RUSTFLAGS
            tier3: true
          - arch: mipsle (tier-3)
            triple: mipsel-unknown-linux-musl
            apt: ""
            linker: mipsel-buildroot-linux-musl-gcc
            xcc: https://toolchains.bootlin.com/downloads/releases/toolchains/mips32el/tarballs/mips32el--musl--stable-2024.02-1.tar.bz2
            xcc_dir: mips32el--musl--stable-2024.02-1
            cc_env: CC_mipsel_unknown_linux_musl
            cc: mipsel-buildroot-linux-musl-gcc
            rflags_env: CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS
            tier3: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `rust-toolchain.toml` 把 channel 钉在 stable，`rustup default nightly` 在
      # 仓库目录里对它无效；tier-3 需要 nightly 的 `-Z build-std`，只能用
      # RUSTUP_TOOLCHAIN 环境变量压过工具链文件（rustup 的优先级：env > file）。
      # 漏掉这一步会让 tier-3 job 静默走到 `skipped` 分支，而 skipped 不置非 0
      # 退出码——job 显示成功但什么都没编译（首次 CI 就是这样骗过了眼睛）。
      - name: Install toolchain
        run: |
          if [ "${{ matrix.tier3 }}" = "true" ]; then
            rustup toolchain install nightly --profile minimal --component rust-src
            rustup default nightly
            echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
            rustup target add ${{ matrix.triple }}
          fi
      # tier-3 要 musl 交叉工具链，三条路都试过：
      # ① apt：Ubuntu 26.04 已无 `gcc-mipsel-linux-gnu`（`E: Package ... has no
      #    installation candidate`）；`gcc-arm-linux-gnueabi` 是 glibc 目标，缺 musl 的
      #    `crtend.o`/`crtn.o`（`ld.bfd: cannot find crtend.o` → `ld returned 1`）。
      # ② musl.cc：包是对的，但**从 GitHub runner 连不上**——`curl: (28) Failed to
      #    connect to musl.cc port 443 after 135502 ms`。
      # ③ Bootlin：可达、体积相近（~130MB），且是 buildroot 出的完整 sysroot
      #    （`crt{1,i,n}.o` + `lib/gcc/*/crt{begin,end}.o` 齐备），与 triple 的 libc 一致。
      - name: Install musl cross toolchain
        if: matrix.xcc != ''
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcc.tar.bz2" "${{ matrix.xcc }}"
          tar -xjf "$RUNNER_TEMP/xcc.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${{ matrix.xcc_dir }}/bin" >> "$GITHUB_PATH"
          # `-Z build-std` 的 armv5te 链接行里 rustc 会传 `-lunwind`（aarch64/arm 走
          # libunwind，mips 不走），而 Bootlin 的 sysroot 只装 `libgcc_eh.a` ——
          # 两者提供同一套 `_Unwind_*`，`libgcc_eh.a` 就是 GCC 自带的 unwind 实现。
          # 实测：`gcc -lunwind -static` 在有该符号链接时能出正确 ELF，缺了则
          # `ld: cannot find -lunwind`（本轮 CI 的 arm 失败点）。
          # `-maxdepth` 必须够深：真实路径是 `lib/gcc/<triple>/<version>/libgcc_eh.a`，
          # 相对 `lib/gcc` 是第 3 层。写 `-maxdepth 2` 会 find 不到、`if` 恒假、
          # 符号链接从未建出来（本机曾因手工建过一次而误判为已生效）。
          glib=$(find "$RUNNER_TEMP/${{ matrix.xcc_dir }}/lib/gcc" -name libgcc_eh.a | head -1)
          if [ -z "$glib" ]; then
            echo "::error::在 ${{ matrix.xcc_dir }} 里找不到 libgcc_eh.a，无法补 libunwind.a（布局变了？）"
            exit 1
          fi
          if [ ! -e "$(dirname "$glib")/libunwind.a" ]; then
            ln -s libgcc_eh.a "$(dirname "$glib")/libunwind.a"
          fi
          if [ ! -e "$(dirname "$glib")/libunwind.a" ]; then
            echo "::error::libunwind.a 符号链接没建出来：$(dirname "$glib")"
            exit 1
          fi
          # 静态链接（下面 Configure cross compiler 里的 `+crt-static`）会让 mips 的
          # 链接行也带上 `-lunwind`，所以这条符号链接两档都需要，不只是 arm。

      - name: Install apt cross linker
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      # i686 只装 gcc-multilib，不写 linker：rustc 对 i686-unknown-linux-gnu 自己会传
      # `-m32`，写 `linker = ""` 反而会让它报 "couldn't extract file stem from
      # specified linker"（首次 CI 就是这条）。只有 matrix.linker 非空时才写。
      - name: Configure cross compiler
        if: matrix.linker != ''
        run: |
          mkdir -p .cargo
          printf '[target.%s]\nlinker = "%s"\n' "${{ matrix.triple }}" "${{ matrix.linker }}" >> .cargo/config.toml
          # `ring` 的 C 内核由 cc-rs 驱动，它按 `${CC_<triple>}` 找编译器；
          # 只配 linker 不够——cc-rs 会自己猜 `mipsel-linux-musl-gcc` 这种不存在的名字
          # （首次 CI 的 tier-3 就是 "failed to find tool \"mipsel-linux-musl-gcc\""）。
          if [ -n "${{ matrix.cc_env }}" ]; then
            echo "${{ matrix.cc_env }}=${{ matrix.cc }}" >> "$GITHUB_ENV"
          fi
          # tier-3 必须显式静态 + 关掉 rustc 自带的「self-contained」起始文件：
          # `rustc --print target-spec-json` 显示 armv5te 的 spec 里
          # `crt-static-default = true`，rustc 于是自己传 `-nostartfiles` 并逐个点名
          # 裸文件名 `crt1.o`/`crti.o`/`crtbegin.o`。而 GNU ld 的 `-L` **只查库不查
          # 目标文件**（实测：`ld -L<dir> crt1.o` 仍报 cannot find，换成绝对路径才行），
          # Bootlin 的 crt 文件在 sysroot/lib 而不在 ld 的默认搜索目录里，于是
          # `ld: cannot find crt1.o`。关掉 self-contained 后起始文件交回 gcc 驱动，
          # 它知道自己的 sysroot；`+crt-static` 则保证产物是静态 musl
          # （实测：不加它 mips 出的是 PIE + INTERP + NEEDED libc.so，不是发布形态）。
          if [ -n "${{ matrix.rflags_env }}" ]; then
            echo "${{ matrix.rflags_env }}=-C target-feature=+crt-static -C link-self-contained=no" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo run -q -p xtask -- build-matrix --target ${{ matrix.triple }}

  build-darwin:
    name: build darwin/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-apple-darwin
          - arch: aarch64
            triple: aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p xtask -- build-matrix --target ${{ matrix.triple }}

  # windows 的两个组合都是 `*-pc-windows-gnu`（plan §4.13），需要 MinGW 的 gcc。
  build-windows:
    name: build windows/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-pc-windows-gnu
            msys: mingw-w64-x86_64-gcc
            bindir: C:/msys64/mingw64/bin
          - arch: i686
            triple: i686-pc-windows-gnu
            msys: mingw-w64-i686-gcc
            bindir: C:/msys64/mingw32/bin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # bin 目录必须按目标架构选：x86_64 用 mingw64，i686 用 mingw32。都写死
      # mingw64 会让 i686 找到 64 位 dlltool，报
      # "dlltool could not create import library ... CreateProcess"（首次 CI 现象）。
      - name: Install MinGW
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm ${{ matrix.msys }}"
          echo "${{ matrix.bindir }}" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p xtask -- build-matrix --target ${{ matrix.triple }}

  # FreeBSD 没有原生 runner，走 VM（plan §4.13 原本就写明「CI 走 FreeBSD VM/qemu」）。
  build-freebsd:
    name: build freebsd/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: i686
            triple: i686-unknown-freebsd
            tier3: false
          # freebsd/arm（`armv6-unknown-freebsd`）**不在 CI 矩阵里**：
          # ① stable 的 FreeBSD 工具链没有它的预编译 std，只能 nightly + `-Z build-std`；
          # ② 即便这样，最后的链接仍在 x86_64 的 FreeBSD VM 里失败——
          #   `ld: error: <armv6 目标文件> is incompatible with /usr/lib/Scrt1.o`
          #   （VM 里没有 armv6 的 C 运行库/头文件，`pkg` 也不提供 armv6 sysroot）。
          # 该组合需要原生 arm 的 FreeBSD runner 或 armv6 sysroot，属 plan §4.14 E33
          # 记录的已知限制；冒称"通过"比不跑更糟（E30 的教训）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y bash curl
          run: |
            set -e
            if [ "${{ matrix.tier3 }}" = "true" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain nightly
              . "$HOME/.cargo/env"
              # 必须显式 `--toolchain nightly`：仓库里的 `rust-toolchain.toml` 把
              # 活动工具链钉在 stable，裸 `rustup component add rust-src` 会把
              # rust-src 装到 **stable** 上（日志里能看到
              # `the missing active toolchain stable-... has been auto-installed`），
              # 于是随后的 `-Z build-std` 在 nightly 下报
              # "nightly/lib/rustlib/src/rust/library/Cargo.lock does not exist"。
              rustup component add rust-src --toolchain nightly
              # rust-toolchain.toml 钉的是 stable，必须用 RUSTUP_TOOLCHAIN 压过它，
              # 否则就是「装了 nightly 却在跑 stable」（首次 CI 的 tier-3 假绿）。
              export RUSTUP_TOOLCHAIN=nightly
              BUILD_FLAGS="-Z build-std=std,panic_abort"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              rustup target add ${{ matrix.triple }}
              BUILD_FLAGS=""
            fi
            cargo build --release -j 1 $BUILD_FLAGS --target ${{ matrix.triple }} -p stowaway-agent
            cargo build --release -j 1 $BUILD_FLAGS --target ${{ matrix.triple }} -p stowaway-admin
            ls -la target/${{ matrix.triple }}/release/stowaway-*

  # §8.6 第五、六条在 CI 上也必须跑：本地有 geiger 但 CI 没有，回退路径要验。
  extras:
    name: no-panic / no-unsafe / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: no-panic
        run: cargo run -q -p xtask -- no-panic
      - name: no-unsafe (cargo-geiger)
        run: |
          cargo install cargo-geiger --locked || echo "geiger 装不上，回退到内置扫描器"
          cargo run -q -p xtask -- no-unsafe
      - name: smoke
        run: cargo run -q -p xtask -- smoke

  audit:
    name: cargo deny (license + advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true # P0 阶段仅告警；P7 转为硬门禁（plan.md §10 G10）