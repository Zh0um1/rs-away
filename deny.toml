# cargo-deny 配置（docs/plan.md §10 G10）。
# P0 阶段 CI 里 `continue-on-error: true`（仅告警）；P7 转硬门禁。
[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # tokio_kcp 0.9.8 自 2024-07 未更新，内部 kcp 0.5.3 可能带旧 advisory；
    # 该依赖默认关闭（transport-kcp feature），见 plan.md §9.1 风险行。
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # 显式禁止 v1 用过、v2 已删除的算法/实现（plan.md §5.3）。
    { name = "md5" },
    { name = "rsa" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]